name: Reproduire les expériences
on: [push, pull_request]
jobs:
  experiences:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m sim.generate --out data/dataset_s0.npz --seed 0
      - run: python -m experiments.run_abc --data data/dataset_s0.npz --seed 0 --out results/ci
      - uses: actions/upload-artifact@v4
        with:
          name: resultats
          path: results/ci/metrics.json
